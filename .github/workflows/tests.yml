name: Controlled platform acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e ".[test]" --no-deps
      - run: python -m agentloop.verify --java --output docs/phase3-validation.json
        env:
          AGENTLOOP_MAVEN_REPOSITORY: ${{ github.workspace }}/.agentloop/m2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-validation
          path: docs/phase3-validation.json
